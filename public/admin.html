<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#ffe6ef" />
  <title>swoon ✦ post a drop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..900,100;1,9..144,400..900,100&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .panel { background: rgba(255,255,255,.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: 28px; padding: 22px; box-shadow: 0 18px 40px rgba(255,61,139,.14); margin-bottom: 22px; }
    .panel h2 { font: italic 800 28px/1 var(--serif); font-variation-settings: "SOFT" 100; margin-bottom: 16px; }
    label { display: block; font-weight: 700; font-size: 13px; margin: 14px 0 6px; }
    input, textarea, select { width: 100%; border: 1.5px solid var(--line); background: #fff; border-radius: 16px; padding: 13px 14px; font-size: 16px; outline: 0; }
    input:focus, textarea:focus, select:focus { border-color: var(--pink); }
    textarea { resize: vertical; min-height: 70px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn { width: 100%; border: 0; margin-top: 18px; padding: 15px; border-radius: 99px; font-weight: 800; font-size: 16px; color: #fff; background: linear-gradient(135deg, var(--pink), #ff6fb0); box-shadow: 0 8px 20px rgba(255,61,139,.35); }
    .btn.soft { background: var(--ink); box-shadow: none; margin-top: 10px; }
    .btn:disabled { opacity: .5; }
    .msg { margin-top: 12px; font-weight: 700; font-size: 14px; min-height: 1em; }
    .msg.bad { color: #d6245d; }
    .mine { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
    .mine:first-of-type { border-top: 0; }
    .mine .th { width: 54px; height: 66px; border-radius: 12px; object-fit: cover; background: linear-gradient(150deg, #ffd9e7, #e9dcff); flex: none; }
    .mine .t { flex: 1; min-width: 0; }
    .mine .t b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mine .t span { font-size: 12px; color: var(--muted); font-weight: 600; }
    .taps { font: 800 18px/1 var(--sans); color: var(--pink); text-align: center; }
    .taps small { display: block; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 3px; }
    .del { border: 0; background: #ffe3ee; color: #d6245d; width: 34px; height: 34px; border-radius: 50%; font-weight: 800; flex: none; }
    .total { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
    .total b { font: 800 34px/1 var(--serif); color: var(--pink); }
  </style>
</head>
<body>
  <div class="blobs" aria-hidden="true"><i></i><i></i><i></i></div>

  <header class="top">
    <a class="mark" href="/">swoon<span>✦</span></a>
    <span class="live">admin</span>
  </header>

  <main class="wrap" style="padding-top: 22px">
    <section class="panel" id="login">
      <h2>hey bestie ♡</h2>
      <form id="loginForm">
        <label for="pw">Password</label>
        <input id="pw" type="password" autocomplete="current-password" required />
        <button class="btn">Let me in</button>
        <p class="msg bad" id="loginMsg"></p>
      </form>
    </section>

    <div id="app" hidden>
      <section class="panel">
        <h2>post a drop ✦</h2>
        <form id="postForm">
          <label for="url">Product link</label>
          <input id="url" type="url" placeholder="https://www.asos.com/…" required />
          <button type="button" class="btn soft" id="grab">✨ Grab photo &amp; details</button>

          <label for="title">Name</label>
          <input id="title" placeholder="Satin slip dress" required maxlength="120" />

          <div class="row2">
            <div>
              <label for="price">Price</label>
              <input id="price" placeholder="$45" maxlength="20" />
            </div>
            <div>
              <label for="type">Type</label>
              <select id="type"><option value="outfit">👗 Outfit</option><option value="makeup">💄 Makeup</option></select>
            </div>
          </div>

          <label for="image">Photo link</label>
          <input id="image" type="url" placeholder="Auto-fills, or paste the product photo link" />

          <label for="note">Your caption</label>
          <textarea id="note" maxlength="280" placeholder="literally obsessed with this for date night 😍"></textarea>

          <button class="btn" id="postBtn">Post it ♡</button>
          <p class="msg" id="postMsg"></p>
        </form>
      </section>

      <section class="panel">
        <div class="total"><h2 style="margin:0">your drops</h2><span><b id="totalTaps">0</b> taps</span></div>
        <div id="mine"></div>
      </section>
    </div>
  </main>

  <script type="module">
    const $ = (id) => document.getElementById(id);
    let pw = "";
    try { pw = sessionStorage.getItem("pw") || ""; } catch {}

    const api = async (path, opts = {}) => {
      const res = await fetch(path, { ...opts, headers: { "content-type": "application/json", "x-admin-password": pw, ...(opts.headers || {}) } });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw Object.assign(new Error(data.error || "Something went wrong"), { status: res.status });
      return data;
    };

    async function enter() {
      try {
        const { posts } = await api("/api/posts?stats=1");
        try { sessionStorage.setItem("pw", pw); } catch {}
        $("login").hidden = true;
        $("app").hidden = false;
        renderMine(posts);
      } catch (e) {
        $("loginMsg").textContent = e.status === 401 ? "Wrong password" : e.message;
        $("login").hidden = false;
        $("app").hidden = true;
      }
    }

    $("loginForm").onsubmit = (e) => { e.preventDefault(); pw = $("pw").value; enter(); };
    if (pw) enter();

    $("grab").onclick = async () => {
      const url = $("url").value.trim();
      if (!url) return $("url").focus();
      $("grab").disabled = true;
      $("grab").textContent = "grabbing…";
      try {
        const d = await api("/api/preview", { method: "POST", body: JSON.stringify({ url }) });
        if (d.title && !$("title").value) $("title").value = d.title;
        if (d.price && !$("price").value) $("price").value = d.price;
        if (d.image && !$("image").value) $("image").value = d.image;
        if (/sephora|ulta/i.test(url)) $("type").value = "makeup";
        $("postMsg").className = "msg";
        $("postMsg").textContent = d.title || d.image ? "Got it ✨ check the details" : "That store didn't share details, fill them in by hand";
      } catch (e) {
        $("postMsg").className = "msg bad";
        $("postMsg").textContent = e.message;
      }
      $("grab").disabled = false;
      $("grab").textContent = "✨ Grab photo & details";
    };

    $("postForm").onsubmit = async (e) => {
      e.preventDefault();
      $("postBtn").disabled = true;
      try {
        await api("/api/posts", {
          method: "POST",
          body: JSON.stringify({ url: $("url").value, title: $("title").value, price: $("price").value, image: $("image").value, note: $("note").value, type: $("type").value }),
        });
        $("postForm").reset();
        $("postMsg").className = "msg";
        $("postMsg").textContent = "Posted ♡ it's live";
        const { posts } = await api("/api/posts?stats=1");
        renderMine(posts);
      } catch (e) {
        $("postMsg").className = "msg bad";
        $("postMsg").textContent = e.message;
      }
      $("postBtn").disabled = false;
    };

    function renderMine(posts) {
      const box = $("mine");
      box.replaceChildren();
      $("totalTaps").textContent = posts.reduce((s, p) => s + p.clicks, 0);
      if (!posts.length) { box.textContent = "Nothing posted yet."; return; }
      for (const p of posts) {
        const row = document.createElement("div");
        row.className = "mine";
        const th = document.createElement(p.image ? "img" : "div");
        th.className = "th";
        if (p.image) { th.src = p.image; th.alt = ""; th.referrerPolicy = "no-referrer"; }
        const t = document.createElement("div");
        t.className = "t";
        const b = document.createElement("b"); b.textContent = p.title;
        const s = document.createElement("span"); s.textContent = `${p.store}${p.price ? " · " + p.price : ""}`;
        t.append(b, s);
        const taps = document.createElement("div");
        taps.className = "taps";
        taps.innerHTML = `${p.clicks}<small>taps</small>`;
        const del = document.createElement("button");
        del.className = "del"; del.textContent = "✕"; del.title = "Delete";
        del.onclick = async () => {
          if (!confirm(`Delete "${p.title}"?`)) return;
          await api(`/api/posts?id=${encodeURIComponent(p.id)}`, { method: "DELETE" });
          const fresh = await api("/api/posts?stats=1");
          renderMine(fresh.posts);
        };
        row.append(th, t, taps, del);
        box.append(row);
      }
    }
  </script>
</body>
</html>
