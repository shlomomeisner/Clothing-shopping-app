<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffe6ef" />
  <title>swoon ✦ the cutest finds</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..900,100;1,9..144,400..900,100&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="blobs" aria-hidden="true"><i></i><i></i><i></i></div>

  <header class="top">
    <a class="mark" href="/">swoon<span>✦</span></a>
    <span class="live"><span class="dot"></span> new drops</span>
  </header>

  <main class="wrap">
    <section class="hero">
      <div class="sticker s1">obsessed ♡</div>
      <div class="sticker s2">✦ hand-picked</div>

      <p class="sub">Outfits from ASOS &amp; Zara, makeup from Sephora &amp; Ulta. Tap anything you love to grab it.</p>
    </section>

    <nav class="tabs" id="tabs">
      <button class="on" data-type="all">✦ All</button>
      <button data-type="outfit">👗 Outfits</button>
      <button data-type="makeup">💄 Makeup</button>
    </nav>

    <section class="feed" id="feed" aria-live="polite">
      <div class="ghost"></div><div class="ghost"></div>
    </section>
  </main>

  <p class="disclose">We may earn a commission when you shop through our links ♡</p>

  <script src="/app.js" type="module"></script>
