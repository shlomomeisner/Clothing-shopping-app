<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#0b0b0a" />
  <title>Rack — your stylist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <header class="top">
    <a class="mark" href="/">Rack<span>.</span></a>
    <button class="new" id="reset" type="button">New look</button>
  </header>

  <main id="feed" class="feed">
    <section class="hero" id="hero">
      <p class="kicker">Personal stylist · Live</p>
      <h1>What are we<br /><em>wearing</em> tonight?</h1>
      <p class="sub">Tell me the vibe, the budget, the occasion. I'll pull the pieces.</p>
      <div class="chips" id="chips">
        <button>First date, under $150</button>
        <button>Quiet luxury basics</button>
        <button>Wedding guest, black tie</button>
        <button>90s streetwear fit</button>
        <button>Office but not boring</button>
      </div>
    </section>
  </main>

  <form class="composer" id="composer" autocomplete="off">
    <input id="input" name="q" placeholder="Describe the fit…" maxlength="500" />
    <button type="submit" id="send" aria-label="Send">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 12h13M12 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </form>
  <p class="disclose">We may earn a commission when you buy through links.</p>

  <script src="/app.js" type="module"></script>
</body>
</html>
